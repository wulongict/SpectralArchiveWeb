
#include /home/ubuntu/SpectralArchive/SpectralArchiveWeb/scripts/nginx-blockips-inthisfile.conf;

gzip_comp_level  9;

gzip_types    text/plain application/javascript application/x-javascript application/json text/javascript text/xml text/css;
fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
fastcgi_param  SERVER_SOFTWARE    nginx;
fastcgi_param  QUERY_STRING       $query_string;
fastcgi_param  REQUEST_METHOD     $request_method;
fastcgi_param  CONTENT_TYPE       $content_type;
fastcgi_param  CONTENT_LENGTH     $content_length;
fastcgi_param  SCRIPT_FILENAME    $document_root$fastcgi_script_name;
fastcgi_param  SCRIPT_NAME        $fastcgi_script_name;
fastcgi_param  REQUEST_URI        $request_uri;
fastcgi_param  DOCUMENT_URI       $document_uri;
fastcgi_param  DOCUMENT_ROOT      $document_root;
fastcgi_param  SERVER_PROTOCOL    $server_protocol;
fastcgi_param  REMOTE_ADDR        $remote_addr;
fastcgi_param  REMOTE_PORT        $remote_port;
fastcgi_param  SERVER_ADDR        $server_addr;
fastcgi_param  SERVER_PORT        $server_port;
fastcgi_param  SERVER_NAME        $server_name;

server {
    auth_basic "login";
    root /home/ubuntu/SpectralArchive/SpectralArchiveWeb/arxiv;
    listen 80;
    server_name localhost localhost;
    location / {
        include  /etc/nginx/mime.types;

        allow all;
        deny all;
    }

    include /home/ubuntu/SpectralArchive/SpectralArchiveWeb/scripts/shared_location.conf;

    location ~ ^/(id|spectrum|peptideseq|identification|remark|summary) {
        fastcgi_pass   127.0.0.1:8710;
    }


}

